name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Backup source files to separate branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create a backup of source files on a separate branch
          git worktree add /tmp/source-backup source || git branch source || true
          cd /tmp/source-backup || true
          git fetch origin main || true
          git checkout main -- src public index.html package.json package-lock.json vite.config.js tailwind.config.js postcss.config.js .github LICENSE README.md 2>/dev/null || true
          git branch -f source 2>/dev/null || true
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" source --force 2>/dev/null || echo "Source backup created"
      
      - name: Deploy built files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Remove source files from main branch checkout
          rm -rf src public index.html
          
          # Copy built files from dist to root
          cp dist/index.html .
          cp -r dist/assets .
          cp dist/favicon.svg .
          
          # Create .nojekyll to prevent Jekyll processing
          touch .nojekyll
          
          # Update README with build info
          echo "# MacFolio - Portfolio Website" > README.md
          echo "" >> README.md
          echo "Last deployed: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> README.md
          echo "" >> README.md
          echo "Source code is preserved in the \`source\` branch." >> README.md
          
          # Commit and push using HTTPS with token
          git add -A
          git commit -m "Deploy built files to GitHub Pages [skip ci]" || echo "No changes to commit"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" main --force
